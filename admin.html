<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SmartPlug - Orders Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>body{font-family:Geist;background:#0e0e0e;color:white}</style>
</head>
<body class="p-6 md:p-10">
<div class="max-w-6xl mx-auto">
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
<div>
<h1 class="text-3xl font-bold mb-2">📦 SmartPlug Orders</h1>
<p class="text-white/50 font-mono text-sm">All website purchases (localStorage + backend if configured)</p>
</div>
<div class="flex gap-2">
<button onclick="loadFromBackend()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full text-sm">Load from Backend /api/orders</button>
<button onclick="exportCSV()" class="bg-white text-black px-4 py-2 rounded-full text-sm font-semibold">Export CSV</button>
<button onclick="clearOrders()" class="bg-red-500/20 text-red-300 border border-red-500/30 px-4 py-2 rounded-full text-sm">Clear Local</button>
<a href="index.html" class="bg-white/10 px-4 py-2 rounded-full text-sm">← Back to Store</a>
</div>
</div>

<div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>
<div id="ordersList" class="space-y-3"></div>
</div>

<script>
function getLocalOrders(){ return JSON.parse(localStorage.getItem('smartplug_orders')||'[]'); }

function render(orders){
  const stats = document.getElementById('stats');
  const list = document.getElementById('ordersList');
  
  const totalRevenue = orders.reduce((s,o)=>s+(o.total||10),0);
  const cities = [...new Set(orders.map(o=>o.city))];
  
  stats.innerHTML = `
    <div class="bg-white/[0.06] border border-white/10 rounded-2xl p-4"><div class="text-[10px] uppercase tracking-widest text-white/40">Total Orders</div><div class="text-2xl font-bold">${orders.length}</div></div>
    <div class="bg-white/[0.06] border border-white/10 rounded-2xl p-4"><div class="text-[10px] uppercase tracking-widest text-white/40">Revenue (COD)</div><div class="text-2xl font-bold">$${totalRevenue}</div></div>
    <div class="bg-white/[0.06] border border-white/10 rounded-2xl p-4"><div class="text-[10px] uppercase tracking-widest text-white/40">Cities</div><div class="text-2xl font-bold">${cities.length}</div></div>
    <div class="bg-white/[0.06] border border-white/10 rounded-2xl p-4"><div class="text-[10px] uppercase tracking-widest text-white/40">Latest</div><div class="text-sm font-mono">${orders[0]?.time ? new Date(orders[0].time).toLocaleString() : '—'}</div></div>
  `;

  if(orders.length===0){
    list.innerHTML = `<div class="bg-white/[0.03] border border-white/10 rounded-2xl p-12 text-center text-white/40">No orders yet. Orders appear here after someone purchases.<br><br>Demo mode: orders saved in browser only. Configure Telegram bot for real notifications.</div>`;
    return;
  }

  list.innerHTML = orders.map(o=>`
    <div class="bg-white/[0.06] border border-white/10 rounded-2xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 hover:bg-white/[0.08] transition">
      <div class="flex-1">
        <div class="flex items-center gap-3 mb-2">
          <span class="font-mono text-[11px] bg-white text-black px-2.5 py-1 rounded-full font-bold">${o.orderId||'N/A'}</span>
          <span class="font-mono text-[11px] text-white/50">${new Date(o.time).toLocaleString()}</span>
          <span class="font-mono text-[11px] bg-white/10 px-2 py-1 rounded-full">$${o.total||10} x${o.qty||o.quantity||1}</span>
        </div>
        <div class="font-semibold">${o.fullName} — <a href="tel:${o.phone}" class="text-[#25D366] hover:underline">${o.phone}</a></div>
        <div class="text-sm text-white/60 mt-1">📍 ${o.city}, ${o.street} ${o.notes ? `<br>📝 ${o.notes}`:''}</div>
      </div>
      <div class="flex gap-2">
        <a href="https://wa.me/${o.phone.replace(/[^0-9]/g,'')}?text=Hi ${encodeURIComponent(o.fullName)}! Your SmartPlug order ${o.orderId} is confirmed. Delivery in 3-4 days COD $${o.total}." target="_blank" class="bg-[#25D366] text-black px-4 py-2 rounded-full text-xs font-mono uppercase">WhatsApp</a>
        <button onclick="copyText(\`${(o.fullName+' | '+o.phone+' | '+o.city+' | '+o.street).replace(/`/g,'')}\`)" class="bg-white/10 px-4 py-2 rounded-full text-xs font-mono">Copy</button>
      </div>
    </div>
  `).join('');
}

function clearOrders(){ if(confirm('Clear all local orders?')){ localStorage.removeItem('smartplug_orders'); render([]); } }
function exportCSV(){
  const orders = getLocalOrders();
  const csv = ['OrderID,Name,Phone,City,Street,Qty,Total,Notes,Time'].concat(orders.map(o=>`"${o.orderId}","${o.fullName}","${o.phone}","${o.city}","${o.street}","${o.qty||o.quantity||1}","${o.total}","${(o.notes||'').replace(/"/g,'""')}","${o.time}"`)).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`smartplug-orders-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}
function copyText(t){ navigator.clipboard.writeText(t); alert('Copied: '+t); }

async function loadFromBackend(){
  try{
    const res = await fetch('/api/orders');
    if(!res.ok) throw new Error('Backend not running');
    const data = await res.json();
    if(data.orders) render(data.orders);
  }catch(e){
    alert('Backend not reachable. Run: node server.js\nLocal orders shown instead.\n\n'+e.message);
    render(getLocalOrders());
  }
}

// initial
render(getLocalOrders());
</script>
</body>
</html>
